<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Portfolio of a senior Flutter developer — mobile, web and desktop apps.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="portfolio">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Portfolio</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0B1120">
  <style>
    /* Shown while Flutter loads; fades out on the first frame. */
    html, body { margin: 0; height: 100%; background: #0B1120; }
    #loader {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px;
      background: radial-gradient(circle at 70% 30%, rgba(129,140,248,.18), transparent 60%), #0B1120;
      transition: opacity .6s ease, visibility .6s;
      z-index: 9999;
    }
    #loader.done { opacity: 0; visibility: hidden; }
    /* Text copy for crawlers, filled by tool/web_meta.dart; never shown. */
    .seo {
      position: absolute; width: 1px; height: 1px; overflow: hidden;
      clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
    }
    #loader .phone {
      width: 46px; height: 92px; border-radius: 12px; position: relative;
      border: 2px solid #2DD4BF; box-shadow: 0 0 32px rgba(45,212,191,.35);
      animation: float 1.6s ease-in-out infinite;
    }
    #loader .phone::before {
      content: ""; position: absolute; top: 6px; left: 50%; width: 14px; height: 4px;
      margin-left: -7px; border-radius: 4px; background: #2DD4BF;
    }
    #loader .bar { width: 140px; height: 3px; border-radius: 3px; background: #1E293B; overflow: hidden; }
    #loader .bar::after {
      content: ""; display: block; width: 40%; height: 100%;
      background: linear-gradient(90deg, #2DD4BF, #818CF8);
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes float { 50% { transform: translateY(-8px) rotate(-4deg); } }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) {
      #loader .phone, #loader .bar::after { animation: none; }
    }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <div id="loader" aria-label="Loading">
    <div class="phone"></div>
    <div class="bar"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loader');
      el.classList.add('done');
      setTimeout(function () { el.remove(); }, 700);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
